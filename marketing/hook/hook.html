<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0e1014; --ink: #f5f2ee; --muted: #a3a0a6; --coral: #ff795f; --card: #181b21; --line: #2a2e36; --ok: #5ad48a; --red: #ff6b6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }
  #glow { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }
  .center { position: absolute; left: 80px; right: 80px; text-align: center; }
  .mega { font-size: 116px; font-weight: 800; line-height: 1.04; letter-spacing: -0.04em; }
  .h2 { font-size: 72px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
  .letter { position: absolute; left: 120px; right: 120px; top: 560px; background: #fffdf9; color: #1c1b1f; border-radius: 28px; padding: 54px 56px 64px; box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  .letter .hd { font-size: 30px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8a8590; }
  .letter .ln { height: 14px; border-radius: 7px; background: #e9e3da; margin-top: 18px; }
  .letter p { font-size: 38px; line-height: 1.4; font-weight: 500; margin-top: 26px; color: #3a3740; }
  .stamp { position: absolute; right: 40px; bottom: 40px; border: 9px solid #1f9d55; color: #1f9d55; border-radius: 20px; padding: 10px 30px; font-size: 64px; font-weight: 900; letter-spacing: .06em; transform-origin: center; }
  .crack { position: absolute; inset: 0; pointer-events: none; }
  .list { position: absolute; left: 80px; right: 80px; }
  .item { display: flex; align-items: center; gap: 30px; padding: 26px 30px; margin-bottom: 18px; background: var(--card); border: 2px solid var(--line); border-radius: 28px; }
  .num { flex: 0 0 74px; height: 74px; border-radius: 22px; background: #23262e; color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 800; }
  .item b { display: block; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; }
  .item span.s { display: block; font-size: 32px; font-weight: 500; color: var(--muted); margin-top: 6px; }
  .tag { font-size: 28px; font-weight: 700; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: 8px 22px; }
  .card { position: absolute; left: 80px; right: 80px; background: var(--card); border: 2px solid var(--line); border-radius: 36px; padding: 36px 40px 18px; box-shadow: 0 30px 70px rgba(0,0,0,.45); }
  .step { display: flex; gap: 24px; align-items: center; padding: 18px 0; border-top: 2px solid var(--line); }
  .dot { flex: 0 0 58px; height: 58px; border-radius: 50%; border: 4px solid #3a3f49; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--muted); }
  .step b { font-size: 38px; font-weight: 700; }
  .meta { display: flex; gap: 14px; margin-top: 8px; align-items: center; }
  .date { font-size: 28px; font-weight: 700; color: var(--coral); }
  .src { font-size: 25px; font-weight: 600; color: var(--ok); background: rgba(90,212,138,.12); border-radius: 999px; padding: 4px 16px; }
  .badge { position: absolute; left: 80px; right: 80px; display: flex; align-items: center; gap: 30px; background: var(--card); border: 3px solid var(--coral); border-radius: 32px; padding: 34px 40px; }
  .badge img { width: 132px; height: 99px; border-radius: 12px; object-fit: cover; }
  .badge .bt { font-size: 52px; font-weight: 700; line-height: 1.2; }
  .btn { display: inline-block; background: var(--coral); color: #1a0d09; font-weight: 800; border-radius: 999px; padding: 32px 60px; box-shadow: 0 20px 60px rgba(255,121,95,.3); }
  #cap { position: absolute; left: 70px; right: 70px; top: 1330px; text-align: center; font-size: 52px; font-weight: 700; line-height: 1.28; text-shadow: 0 3px 18px rgba(0,0,0,.9); }
  #cap .w { opacity: .35; } #cap .w.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="glow" width="1080" height="1920"></canvas>
<div id="root" class="layer"></div>
<div id="cap"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 4);
const easeIn = x => x * x * x;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function show(e, t, a, b, extra = "") {
  const on = t >= a && t < b; e.style.visibility = on ? "visible" : "hidden"; if (!on) return;
  const i = easeOut(prog(t, a, a + .4)), o = easeIn(prog(t, b - .2, b));
  e.style.opacity = i * (1 - o); e.style.filter = `blur(${(1 - i) * 8 + o * 8}px)`;
  e.style.transform = `translateY(${(1 - i) * 70 - o * 60}px) ${extra}`;
}
function logoSVG(size) { const L = window.LOGO; return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible"><path d="${L.ring}" fill="none" stroke="#f5f2ee" stroke-width="5.5" stroke-linecap="round"/><path fill="#ff795f" d="${L.europe}"/><path fill="#ff795f" d="${L.swoosh}"/><path fill="#f5f2ee" transform="${L.planeT}" d="${L.plane}"/></svg>`; }
const wordmark = () => `<span translate="no">Doc<span style="color:var(--coral)">Route</span></span>`;
let S = {}, TL;
function build() {
  const X = window.T.screen, root = document.getElementById("root"); TL = window.TL;
  // hook: the admission letter with its stamp, then it breaks
  S.gotIn = el("div", "center mega", esc(X.gotIn)); S.gotIn.style.top = "250px"; root.append(S.gotIn);
  S.easy = el("div", "center mega", `<span style="color:var(--coral)">${esc(X.easy)}</span>`); S.easy.style.top = "250px"; root.append(S.easy);
  S.letter = el("div", "letter", `<div class="hd">${esc(X.letterHead)}</div><div class="ln" style="width:55%"></div><p>${esc(X.letterBody)}</p><div class="ln" style="width:80%"></div><div class="ln" style="width:62%"></div><div class="stamp">${esc(X.admitted)}</div>
    <svg class="crack" viewBox="0 0 840 760" preserveAspectRatio="none"><path d="M430 -10 L390 160 L460 250 L370 400 L450 520 L400 770" fill="none" stroke="#0e1014" stroke-width="10" stroke-linejoin="round"/></svg>`);
  root.append(S.letter); S.stamp = S.letter.querySelector(".stamp"); S.crack = S.letter.querySelector(".crack path");
  S.crackLen = S.crack.getTotalLength();
  // what comes next: five items
  S.next = el("div", "center h2", esc(X.next)); S.next.style.top = "210px"; root.append(S.next);
  S.list = el("div", "list", X.items.map(([a, b], i) => `<div class="item"><div class="num">${i + 1}</div><div><b>${esc(a)}</b><span class="s">${esc(b)}</span></div></div>`).join("") + `<div style="text-align:center;margin-top:10px"><span class="tag">${esc(X.depends)}</span></div>`);
  S.list.style.top = "350px"; root.append(S.list); S.items = [...S.list.querySelectorAll(".item")]; S.dep = S.list.lastElementChild;
  // the cost of one missed deadline
  S.miss = el("div", "layer", `<div class="center" style="top:420px"><span style="display:inline-flex;gap:22px;align-items:center;font-size:60px;font-weight:800;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:24px 50px" class="pill"><span class="pl">${esc(X.deadline)}</span></span></div>
    <div class="center mega" style="top:620px;color:var(--red);font-size:104px">${esc(X.year)}</div>`);
  root.append(S.miss); S.pill = S.miss.querySelector(".pill"); S.pl = S.miss.querySelector(".pl"); S.year = S.miss.querySelector(".mega");
  // DocRoute: one route
  S.logo = el("div", "layer", `<div style="position:absolute;left:0;right:0;top:190px;display:flex;justify-content:center;align-items:center;gap:26px">${logoSVG(120)}<span style="font-size:96px;font-weight:800;letter-spacing:-0.035em">${wordmark()}</span></div>`); root.append(S.logo);
  S.card = el("div", "card", `<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><span class="tag">${esc(X.example)}</span></div>` + X.route.map((r, i) => `<div class="step"><div class="dot">${i + 1}</div><div><b>${esc(r)}</b><div class="meta"><span class="date">${esc(X.dates[i])}</span>${i === 3 ? "" : `<span class="src">✓ ${esc(X.source)}</span>`}</div></div></div>`).join(""));
  S.card.style.top = "390px"; root.append(S.card); S.steps = [...S.card.querySelectorAll(".step")];
  // passport
  S.pt = el("div", "center mega", esc(X.passport)); S.pt.style.top = "330px"; root.append(S.pt);
  S.badge = el("div", "badge", `<img><div class="bt"></div>`); S.badge.style.top = (330 + S.pt.offsetHeight + 80) + "px"; root.append(S.badge);
  // call to action
  S.cta = el("div", "layer", `<div style="position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center">${logoSVG(240)}</div>
    <div class="center" style="top:590px;font-size:112px;font-weight:800;letter-spacing:-0.035em">${wordmark()}</div>
    <div class="center" style="top:780px"><span class="btn" style="font-size:60px">${esc(X.cta)} →</span></div>
    <div class="center" style="top:980px;font-size:46px;font-weight:700">docroute-student.vercel.app</div>
    <div class="center" style="top:1070px;font-size:32px;font-weight:500;color:var(--muted)">${esc(X.small)}</div>`); root.append(S.cta);
  S.ctaParts = [...S.cta.children];
  S.capLines = window.T.lines.map(l => l.split(/(\s+)/).map(p => /^\s+$/.test(p) ? p : `<span class="w">${esc(p)}</span>`).join(""));
  setBadge(0);
}
let bi = -1;
function setBadge(i) { if (i === bi) return; bi = i; const X = window.T.screen, codes = ["in", "ng", "br", "vn", "kz"]; S.badge.querySelector("img").src = `flags/${codes[i]}.svg`; S.badge.querySelector(".bt").textContent = X.badge.replace("{0}", X.countries[i]); }
let capIdx = -2;
function caption(t) {
  const cap = document.getElementById("cap");
  let k = -1; TL.forEach((l, i) => { if (t >= l.a - .1 && t < (TL[i + 1] ? TL[i + 1].a - .1 : l.b + 2)) k = i; });
  if (k !== capIdx) { capIdx = k; cap.innerHTML = k >= 0 ? S.capLines[k] : ""; cap.style.fontSize = "52px"; let fs = 52; while (cap.offsetHeight > 270 && fs > 36) { fs -= 2; cap.style.fontSize = fs + "px"; } S.ws = [...cap.querySelectorAll(".w")]; S.wl = S.ws.map(w => w.textContent.length); }
  if (k < 0) return;
  const l = TL[k], p = prog(t, l.a, l.b), total = S.wl.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; S.ws.forEach((w, i) => { w.classList.toggle("on", acc / total <= p + .02); acc += S.wl[i]; });
}
function glow(t) {
  const c = document.getElementById("glow"), g = c.getContext("2d"); g.clearRect(0, 0, 1080, 1920);
  const red = TL ? clamp(prog(t, TL[8].a - .2, TL[8].a + .3) - prog(t, TL[9].a - .3, TL[9].a)) : 0;
  const blob = (x, y, r, col) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920); };
  blob(780 + Math.sin(t * .6) * 220, 520 + Math.cos(t * .45) * 220, 820, `rgba(${255},${Math.round(121 - 60 * red)},${Math.round(95 - 40 * red)},${.17 + .1 * red})`);
  blob(260 - Math.sin(t * .5) * 200, 1480 + Math.sin(t * .35) * 180, 800, "rgba(110,120,255,.12)");
}
function setTime(t) {
  glow(t);
  const A = i => TL[i].a, E = i => (TL[i + 1] ? TL[i + 1].a : 1e9);
  // hook: letter is on screen from frame 0, the stamp slams at 0.35 s
  const brk = A(1);
  show(S.gotIn, t, 0, brk - .05); if (t < brk) S.gotIn.style.opacity = 1, S.gotIn.style.filter = "none", S.gotIn.style.transform = `scale(${1.08 - .08 * easeOut(prog(t, 0, .5))})`;
  show(S.easy, t, brk, E(1) - .05);
  const fall = easeIn(prog(t, brk + .25, E(1)));
  const shake = t > brk && t < brk + .35 ? Math.sin(t * 90) * 14 * (1 - prog(t, brk, brk + .35)) : 0;
  S.letter.style.visibility = t < E(1) ? "visible" : "hidden";
  S.letter.style.transform = `translate(${shake}px, ${fall * 900}px) rotate(${-2 + fall * 14}deg) scale(${t < .3 ? .9 + .1 * easeOut(prog(t, 0, .3)) : 1})`;
  S.letter.style.filter = `grayscale(${prog(t, brk, brk + .3)})`;
  const sp = prog(t, .35, .55); S.stamp.style.opacity = sp > 0 ? 1 : 0; S.stamp.style.transform = `rotate(-12deg) scale(${2.4 - 1.4 * easeOut(sp)})`;
  S.crack.style.strokeDasharray = S.crackLen; S.crack.style.strokeDashoffset = S.crackLen * (1 - easeOut(prog(t, brk, brk + .25)));
  // what comes next + items
  show(S.next, t, A(2), A(8)); show(S.list, t, A(2) + .1, A(8));
  S.items.forEach((e, i) => { const on = t >= A(3 + i) - .1, cur = on && t < E(3 + i) - .1; const p = easeOut(prog(t, A(3 + i) - .1, A(3 + i) + .25));
    e.style.opacity = on ? (cur || t >= A(8) - .5 ? 1 : .55) : .25; e.style.borderColor = cur ? "var(--coral)" : "var(--line)";
    e.style.transform = `scale(${on ? 1 + .03 * (1 - p) : .97})`; const n = e.querySelector(".num"); n.style.background = on ? "rgba(255,121,95,.18)" : "#23262e"; n.style.color = on ? "var(--coral)" : "var(--muted)"; });
  S.dep.style.opacity = prog(t, A(7) + .5, A(7) + 1);
  // missed deadline
  show(S.miss, t, A(8), A(9));
  const mp = prog(t, A(8) + .5, A(8) + .8); S.pill.style.borderColor = mp > .5 ? "var(--red)" : "var(--line)"; S.pill.style.color = mp > .5 ? "var(--red)" : "var(--ink)";
  S.pl.textContent = mp > .5 ? `✕ ${window.T.screen.missed}` : window.T.screen.deadline; S.pill.style.transform = `scale(${1 + .12 * Math.sin(Math.PI * mp)})`;
  S.year.style.opacity = prog(t, A(8) + 1.1, A(8) + 1.5); S.year.style.transform = `scale(${1.15 - .15 * easeOut(prog(t, A(8) + 1.1, A(8) + 1.5))})`;
  // DocRoute route
  show(S.logo, t, A(9), A(10)); show(S.card, t, A(9) + .3, A(10));
  const span = TL[9].b - (A(9) + 1.2);
  S.steps.forEach((s, i) => { const d = prog(t, A(9) + 1.2 + span * i / 5, A(9) + 1.5 + span * i / 5), n = s.querySelector(".dot");
    n.style.borderColor = d > 0 ? "var(--ok)" : "#3a3f49"; n.style.background = `rgba(90,212,138,${.9 * d})`; n.style.color = d > .5 ? "#0e1014" : "var(--muted)"; n.textContent = d > .5 ? "✓" : String(i + 1); });
  // passport
  show(S.pt, t, A(10), A(11)); show(S.badge, t, A(10) + .1, A(11)); setBadge(Math.min(4, Math.floor(clamp(t - A(10) - .1, 0, 99) / ((E(10) - A(10)) / 5))));
  // call to action
  S.cta.style.visibility = t >= A(11) - .05 ? "visible" : "hidden";
  S.ctaParts.forEach((e, i) => { const a = A(11) - .05 + i * .15, p = easeOut(prog(t, a, a + .4)); e.style.opacity = p; e.style.transform = `translateY(${(1 - p) * 60}px)`; });
  caption(t);
}
window.build = build; window.setTime = setTime;
</script>
</body>
</html>
