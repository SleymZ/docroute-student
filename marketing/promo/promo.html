<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 500; src: url("fonts/noto-sans-devanagari-devanagari-500-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 700; src: url("fonts/noto-sans-devanagari-devanagari-700-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 800; src: url("fonts/noto-sans-devanagari-devanagari-800-normal.woff2"); }
  :root {
    --bg: #0f1115; --ink: #f5f2ee; --muted: #a9a5a1; --coral: #ff795f; --coral-d: #d4502f;
    --card: #191c22; --line: #2b2f37; --ok: #5ad48a; --red: #ff6b6b; --red-bg: #3a1618;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Inter", "Noto Sans Devanagari", "Noto Sans CJK SC", sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; position: relative;
  }
  body.zh { font-family: "Inter", "Noto Sans CJK SC", sans-serif; }
  #glow { position: absolute; inset: -200px; pointer-events: none; }
  .layer { position: absolute; inset: 0; }
  .center { position: absolute; left: 90px; right: 90px; text-align: center; }
  .h1 { font-weight: 800; font-size: 118px; line-height: 1.08; letter-spacing: -0.03em; }
  .h2 { font-weight: 800; font-size: 82px; line-height: 1.12; letter-spacing: -0.025em; }
  .lead { font-weight: 600; font-size: 46px; line-height: 1.3; color: var(--muted); }
  body.hi .h1, body.hi .h2 { letter-spacing: 0; line-height: 1.3; }
  body.zh .h1, body.zh .h2 { letter-spacing: 0.01em; }
  .coral { color: var(--coral); }
  .chip {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    padding: 22px 30px 22px 26px; font-size: 40px; font-weight: 600;
    box-shadow: 0 18px 40px rgba(0,0,0,.45); display: flex; align-items: center; gap: 18px;
  }
  .chip .dots { display: flex; gap: 8px; }
  .chip .dots i { width: 14px; height: 14px; border-radius: 50%; background: #3a3f49; display: block; }
  .chip .x { color: #6b7079; font-weight: 500; margin-left: 8px; }
  .word { font-weight: 800; font-size: 120px; letter-spacing: -0.035em; }
  .card {
    position: absolute; left: 80px; right: 80px; background: var(--card);
    border: 2px solid var(--line); border-radius: 40px; padding: 44px 44px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .cardhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .cardhead .t { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 800; }
  .tag { font-size: 28px; font-weight: 700; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: 8px 22px; }
  .step { display: flex; gap: 28px; align-items: flex-start; padding: 26px 0; border-top: 2px solid var(--line); }
  .num { flex: 0 0 72px; height: 72px; border-radius: 50%; border: 4px solid #3a3f49; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; color: var(--muted); position: relative; }
  .num svg { position: absolute; inset: -4px; }
  .stxt { flex: 1; min-width: 0; }
  .stxt b { display: block; font-size: 42px; font-weight: 700; line-height: 1.22; }
  .meta { display: flex; gap: 16px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .date { font-size: 32px; font-weight: 700; color: var(--coral); }
  .src { font-size: 28px; font-weight: 600; color: var(--ok); background: rgba(90,212,138,.12); border-radius: 999px; padding: 6px 18px; }
  .badge {
    position: absolute; left: 80px; right: 80px; display: flex; align-items: center; gap: 30px;
    background: var(--card); border: 3px solid var(--coral); border-radius: 32px; padding: 34px 40px;
  }
  .badge img { width: 132px; height: 99px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
  .badge .bt { font-size: 50px; font-weight: 700; line-height: 1.25; }
  .warn {
    position: absolute; left: 80px; right: 80px; display: flex; gap: 28px; align-items: flex-start;
    background: var(--red-bg); border: 3px solid var(--red); border-radius: 32px; padding: 36px 40px;
    font-size: 42px; font-weight: 700; line-height: 1.3; color: #ffd0d0;
  }
  .btn {
    display: inline-block; background: var(--coral); color: #1a0d09; font-weight: 800;
    font-size: 60px; border-radius: 999px; padding: 34px 70px; box-shadow: 0 20px 60px rgba(255,121,95,.35);
  }
  .url { font-size: 44px; font-weight: 700; color: var(--ink); }
  .small { font-size: 32px; font-weight: 500; color: var(--muted); }
</style>
</head>
<body>
<canvas id="glow" width="1480" height="2320"></canvas>
<div id="root" class="layer"></div>
<script>
// Everything is drawn from window.T (texts), window.LOGO (paths) and setTime(t).
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// split a headline after sentence punctuation; each phrase stays on one line
const phrases = s => esc(s).split(/(?<=[.。，、！？।]\s?)/).filter(x => x.trim()).map(x => `<span style="display:inline-block;white-space:nowrap;max-width:100%">${x.trim()}&nbsp;</span>`).join("");
// in at a, out at b (fade+lift); returns opacity and dy
function io(t, a, b, inDur = .45, outDur = .3) {
  const i = easeOut(prog(t, a, a + inDur)), o = easeInOut(prog(t, b - outDur, b));
  return { op: i * (1 - o), dy: (1 - i) * 60 - o * 60 };
}
function setIO(e, s, extra = "") { e.style.opacity = s.op; e.style.transform = `translateY(${s.dy}px) ${extra}`; e.style.visibility = s.op <= 0.001 ? "hidden" : "visible"; }

function logoSVG(size, ink = "#f5f2ee", coral = "#ff795f") {
  const L = window.LOGO;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
    <path class="ring" d="${L.ring}" fill="none" stroke="${ink}" stroke-width="5.5" stroke-linecap="round"/>
    <path class="eu" fill="${coral}" d="${L.europe}"/>
    <path class="sw" fill="${coral}" d="${L.swoosh}"/>
    <g class="plane"><path fill="${ink}" transform="${L.planeT}" d="${L.plane}"/></g></svg>`;
}
const wordmark = () => `<span translate="no">Doc<span class="coral">Route</span></span>`;

let S = {};
function build() {
  const T = window.T, root = document.getElementById("root");
  document.body.classList.add(window.LANG);
  // Scene 1: hook
  S.hook = el("div", "center h1", esc(T.hook)); S.hook.style.top = "640px"; root.append(S.hook);
  S.purp = el("div", "center lead", esc(T.purposes)); S.purp.style.top = "0px"; root.append(S.purp);
  // Scene 2: tab chaos
  S.p1 = el("div", "center h2", phrases(T.p1)); S.p1.style.top = "250px"; root.append(S.p1);
  S.p2 = el("div", "center h2 coral", esc(T.p2)); S.p2.style.top = "1330px"; root.append(S.p2);
  const spots = [[110,660,-6],[540,700,5],[160,820,4],[500,880,-4],[90,990,-3],[540,1050,6],[170,1150,5],[470,1200,-5]];
  S.chips = T.chips.map((c, i) => {
    const e = el("div", "chip", `<span class="dots"><i></i><i></i><i></i></span>${esc(c)}<span class="x">×</span>`);
    root.append(e); return { e, spot: spots[i] };
  });
  // Scene 3: logo
  S.logo = el("div", "layer"); S.logo.innerHTML = `<div style="position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center">${logoSVG(380)}</div>
    <div class="center word" style="top:1010px">${wordmark()}</div>
    <div class="center lead tg" style="top:1180px;color:var(--ink)">${esc(T.tagline)}</div>`;
  root.append(S.logo);
  S.logoWord = S.logo.querySelector(".word"); S.logoTag = S.logo.querySelector(".tg");
  S.logoSvg = S.logo.querySelector("svg");
  // Scene 4: route card
  S.rt = el("div", "center h2", phrases(T.routeTitle)); S.rt.style.top = "230px"; root.append(S.rt);
  S.card = el("div", "card");
  S.card.innerHTML = `<div class="cardhead"><div class="t">${logoSVG(56)}${wordmark()}</div><div class="tag">${esc(T.example)}</div></div>` +
    T.steps.map((s, i) => `<div class="step"><div class="num"><span>${i + 1}</span></div><div class="stxt"><b>${esc(s)}</b>
      <div class="meta"><span class="date">${esc(T.dates[i])}</span><span class="src">✓ ${esc(T.source)}</span></div></div></div>`).join("");
  root.append(S.card);
  S.steps = [...S.card.querySelectorAll(".step")];
  // Scene 5: passport
  S.pt = el("div", "center h2", esc(T.passportTitle)); S.pt.style.top = "330px"; root.append(S.pt);
  S.badge = el("div", "badge"); S.badge.innerHTML = `<img><div class="bt"></div>`; root.append(S.badge);
  S.warn = el("div", "warn", `<svg width="64" height="64" viewBox="0 0 24 24" style="flex:0 0 64px;margin-top:2px"><path fill="#ff6b6b" d="M12 2 1 21h22L12 2zm0 6c.6 0 1 .4 1 1v5a1 1 0 0 1-2 0V9c0-.6.4-1 1-1zm0 9.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg><span>${esc(T.warning)}</span>`);
  root.append(S.warn);
  // Scene 6: CTA
  S.end = el("div", "layer");
  S.end.innerHTML = `<div style="position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center">${logoSVG(250)}</div>
    <div class="center word" style="top:620px;font-size:104px">${wordmark()}</div>
    <div class="center lead e1" style="top:780px;color:var(--ink)">${esc(T.tagline)}</div>
    <div class="center e2" style="top:930px"><span class="btn">${esc(T.cta)}</span></div>
    <div class="center lead e3" style="top:1130px">${esc(T.stats)}<br>${esc(T.sub)}</div>
    <div class="center url e4" style="top:1310px">docroute-student.vercel.app</div>
    <div class="center small e5" style="top:1400px">${esc(T.disclaimer)}</div>`;
  root.append(S.end);
  S.endParts = ["svg", ".word", ".e1", ".e2", ".e3", ".e4", ".e5"].map(q => S.end.querySelector(q));
  // fit long headlines into at most 3 lines
  for (const e of [S.hook, S.p1, S.p2, S.rt, S.pt]) fit(e, e === S.hook ? 3 : 3);
  // purposes line sits under the hook
  S.purp.style.top = (640 + S.hook.offsetHeight + 40) + "px";
  // chips must fit the frame width
  S.chips.forEach(c => { const w = c.e.offsetWidth; if (c.spot[0] + w > 1000) c.spot[0] = Math.max(60, 1000 - w); });
  // vertical layout of scene 4 and 5
  S.card.style.top = (S.rt.offsetTop + S.rt.offsetHeight + 60) + "px";
  const total = S.pt.offsetHeight + 80 + S.badge.offsetHeight + 50 + S.warn.offsetHeight;
  S.pt.style.top = Math.round(900 - total / 2) + "px";
  S.badge.style.top = (S.pt.offsetTop + S.pt.offsetHeight + 80) + "px";
  S.warn.style.top = (S.badge.offsetTop + S.badge.offsetHeight + 50) + "px";
  setBadge(0);
}
function fit(e, maxLines) {
  let fs = parseFloat(getComputedStyle(e).fontSize);
  const lh = () => parseFloat(getComputedStyle(e).lineHeight);
  const wide = () => [...e.querySelectorAll("span")].some(x => x.scrollWidth > e.clientWidth + 1);
  while ((e.offsetHeight > lh() * maxLines + 2 || wide()) && fs > 40) { fs -= 4; e.style.fontSize = fs + "px"; }
}
let badgeIdx = -1;
function setBadge(i) {
  if (i === badgeIdx) return; badgeIdx = i;
  const T = window.T, codes = ["in", "ng", "br", "vn", "kz"];
  S.badge.querySelector("img").src = `flags/${codes[i]}.svg`;
  S.badge.querySelector(".bt").innerHTML = esc(T.badge.replace("{0}", T.countries[i]));
}

function glow(t) {
  const c = document.getElementById("glow"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const x = 740 + Math.sin(t * .5) * 260, y = 700 + Math.cos(t * .37) * 300;
  let r = g.createRadialGradient(x, y, 0, x, y, 900);
  r.addColorStop(0, "rgba(255,121,95,0.20)"); r.addColorStop(1, "rgba(255,121,95,0)");
  g.fillStyle = r; g.fillRect(0, 0, c.width, c.height);
  const x2 = 500 - Math.sin(t * .41) * 240, y2 = 1800 + Math.sin(t * .3) * 200;
  r = g.createRadialGradient(x2, y2, 0, x2, y2, 800);
  r.addColorStop(0, "rgba(90,120,255,0.10)"); r.addColorStop(1, "rgba(90,120,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, c.width, c.height);
}

function setTime(t) {
  glow(t);
  // 1. hook 0–3.5
  const hk = io(t, .15, 3.5, .5); setIO(S.hook, hk, `scale(${.92 + .08 * easeOut(prog(t, .15, .7))})`);
  setIO(S.purp, io(t, .9, 3.5, .5));
  // 2. chaos 3.5–8.5
  setIO(S.p1, io(t, 3.6, 8.6, .45));
  setIO(S.p2, io(t, 6.0, 8.6, .45));
  const conv = easeInOut(prog(t, 8.5, 9.3));
  S.chips.forEach((c, i) => {
    const a = 3.8 + i * .28, p = back(prog(t, a, a + .45)), vis = prog(t, a, a + .12);
    const [sx, sy, rot] = c.spot, w = c.e.offsetWidth, h = c.e.offsetHeight;
    const fromX = (i % 2 ? 1300 : -900), fromY = sy + (i % 3 - 1) * 200;
    let x = fromX + (sx - fromX) * p, y = fromY + (sy - fromY) * p;
    const shake = t > 6 && t < 8.5 ? Math.sin(t * 22 + i * 1.7) * 3 * prog(t, 6, 6.6) : 0;
    x += shake; let r = rot + shake * .6, s = 1;
    if (conv > 0) { x += (540 - w / 2 - x) * conv; y += (790 - h / 2 - y) * conv; s = 1 - .85 * conv; r *= 1 - conv; }
    c.e.style.opacity = vis * (1 - prog(t, 9.0, 9.3));
    c.e.style.visibility = c.e.style.opacity > .001 ? "visible" : "hidden";
    c.e.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;
  });
  // 3. logo 9.0–11.5
  const lg = io(t, 9.0, 11.5, .6); S.logo.style.opacity = t < 11.5 && t > 9 ? 1 : 0;
  S.logoSvg.style.opacity = lg.op; S.logoSvg.style.transform = `scale(${.4 + .6 * back(prog(t, 9.0, 9.6))}) translateY(${lg.dy < 0 ? lg.dy : 0}px)`;
  const pl = easeOut(prog(t, 9.2, 10.4)); const plane = S.logoSvg.querySelector(".plane");
  plane.style.transform = `translate(${-14 + 14 * pl}px, ${10 - 10 * pl}px)`; plane.style.opacity = pl;
  setIO(S.logoWord, io(t, 9.55, 11.5, .45)); setIO(S.logoTag, io(t, 9.95, 11.5, .45));
  // 4. route 11.5–17.5
  setIO(S.rt, io(t, 11.55, 17.5, .45));
  setIO(S.card, io(t, 11.8, 17.5, .55, .3), "");
  S.steps.forEach((s, i) => {
    const a = 12.3 + i * .45; setIO(s, io(t, a, 99, .4));
    const d = prog(t, 14.3 + i * .55, 14.6 + i * .55), num = s.querySelector(".num");
    num.style.borderColor = d > 0 ? "var(--ok)" : "#3a3f49";
    num.style.background = `rgba(90,212,138,${.9 * d})`;
    num.style.color = d > .5 ? "#0f1115" : "var(--muted)";
    num.firstChild.textContent = d > .5 ? "✓" : String(i + 1);
    num.style.transform = `scale(${1 + .18 * Math.sin(Math.PI * d)})`;
  });
  // 5. passport 17.5–21
  setIO(S.pt, io(t, 17.55, 21, .45));
  setIO(S.badge, io(t, 17.8, 21, .45));
  setBadge(Math.min(4, Math.floor(clamp(t - 18.1, 0, 99) / .6)));
  const bp = prog(t, 18.1, 21) * 5 % 1; S.badge.querySelector("img").style.transform = `scale(${1 + .08 * Math.max(0, 1 - bp * 4)})`;
  setIO(S.warn, io(t, 18.7, 21, .45));
  // 6. CTA 21–25
  S.end.style.opacity = t >= 21 ? 1 : 0;
  S.endParts.forEach((e, i) => {
    const s = io(t, 21.05 + i * .18, 99, .45);
    let extra = "";
    if (i === 0) extra = `scale(${.6 + .4 * back(prog(t, 21.05, 21.6))})`;
    if (i === 3) extra = `scale(${1 + .04 * Math.max(0, Math.sin((t - 22.4) * 4.2))})`;
    setIO(e, s, extra);
  });
}
window.setTime = setTime; window.build = build;
</script>
</body>
</html>
