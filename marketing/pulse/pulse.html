<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050506; }
  body { font-family: "Inter Display", "Inter", sans-serif; -webkit-font-smoothing: antialiased; position: relative; color: #f4f1ec; }
  canvas { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #f4f1ec; opacity: 0; }
  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  .big { font-size: 210px; font-weight: 900; line-height: .9; letter-spacing: -0.045em; text-transform: uppercase; }
  .mid { font-size: 96px; font-weight: 700; line-height: 1.08; letter-spacing: -0.03em; }
  .soft { font-size: 76px; font-weight: 300; line-height: 1.15; letter-spacing: -0.02em; }
  .coral { color: #ff795f; }
  .grey { color: #8f8b86; }
  .list div { font-size: 140px; font-weight: 900; line-height: 1.04; letter-spacing: -0.04em; text-transform: uppercase; }
  .num { font-size: 150px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .cap { font-size: 46px; font-weight: 500; color: #8f8b86; letter-spacing: .01em; margin-top: 10px; margin-bottom: 56px; }
  #meter { position: absolute; left: 64px; top: 170px; font: 600 38px "Inter", sans-serif; letter-spacing: .22em; color: #6d6965; }
  #meter b { color: #ff795f; font-weight: 800; }
  #end .w { font-size: 120px; font-weight: 800; letter-spacing: -0.04em; margin-top: 34px; font-family: "Inter", sans-serif; }
  #end .e1 { margin-top: 36px; font-size: 62px; font-weight: 400; line-height: 1.15; }
  #end .btn { margin-top: 80px; border: 3px solid #ff795f; color: #ff795f; font-size: 54px; font-weight: 700; border-radius: 999px; padding: 26px 60px; }
  #end .u { margin-top: 44px; font-size: 40px; font-weight: 600; font-family: "Inter", sans-serif; }
  #end .s { margin-top: 14px; font-size: 34px; font-weight: 500; color: #8f8b86; }
</style>
</head>
<body>
<canvas id="ecg" width="1080" height="1920"></canvas>
<div id="flash"></div>
<div id="l0" class="layer"><div class="big" id="w0"></div></div>
<div id="l1" class="layer"><div class="mid" id="a1">You want to study<br>in Europe?</div><div class="soft grey" id="b1" style="margin-top:44px">Good. Here’s the truth.</div></div>
<div id="l2" class="layer list"></div>
<div id="l3" class="layer"><div class="soft" id="a3" style="font-size:120px;font-weight:200">Breathe.</div><div class="soft grey" id="b3" style="margin-top:40px">One step at a time.</div></div>
<div id="l4" class="layer">
  <div class="num" id="n1">2,598</div><div class="cap" id="c1">universities</div>
  <div class="num" id="n2">46</div><div class="cap" id="c2">countries</div>
  <div class="soft" id="c3" style="font-size:62px">Every rule with its<br><span class="coral">official source.</span></div>
</div>
<div id="end" class="layer"></div>
<canvas id="grain" width="270" height="480" style="width:1080px;height:1920px;image-rendering:pixelated;opacity:.07;mix-blend-mode:screen"></canvas>
<div id="meter">INTENSITY <b id="pct">90%</b></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - x, 3);
const $ = id => document.getElementById(id);
const SEGS = [[0, 3.0, 140, 0.9], [3.0, 6.5, 80, 0.5], [6.5, 10.5, 120, 0.7], [10.5, 14.0, 62, 0.3], [14.0, 17.5, 54, 0.2], [17.5, 22.0, 0, 0.1]];
const BEATS = [];
for (const [a, b, bpm, v] of SEGS) if (bpm) for (let x = a; x < b - 0.05; x += 60 / bpm) BEATS.push([x, v]);
const WORDS = ["Nobody", "is coming", "to plan", "your future."];
const LIST = ["Visa.", "Deadlines.", "IELTS.", "Apostille.", "Funds.", "Time zones."];
const segAt = t => SEGS.find(s => t >= s[0] && t < s[1]) || SEGS[SEGS.length - 1];

function logoSVG(size) { const L = window.LOGO; return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible"><path d="${L.ring}" fill="none" stroke="#f4f1ec" stroke-width="5.5" stroke-linecap="round"/><path fill="#ff795f" d="${L.europe}"/><path fill="#ff795f" d="${L.swoosh}"/><path fill="#f4f1ec" transform="${L.planeT}" d="${L.plane}"/></svg>`; }
function build() {
  $("l2").innerHTML = LIST.map(w => `<div>${w}</div>`).join("");
  $("end").innerHTML = `${logoSVG(260)}<div class="w">Doc<span class="coral">Route</span></div><div class="e1">Your route to Europe,<br>step by step.</div><div class="btn">Link in bio</div><div class="u">docroute-student.vercel.app</div><div class="s">Free to start</div>`;
}
// one heartbeat on the trace: P, QRS, T
function wave(d) {
  if (d < 0 || d > 0.6) return 0;
  const g = (c, w, h) => h * Math.exp(-Math.pow((d - c) / w, 2));
  return g(0.04, 0.025, 0.12) - g(0.11, 0.008, 0.18) + g(0.13, 0.010, 1) - g(0.15, 0.010, 0.35) + g(0.34, 0.05, 0.25);
}
function drawECG(t) {
  const c = $("ecg").getContext("2d"); c.clearRect(0, 0, 1080, 1920);
  const pen = 860, pps = 420, y0 = 1520, inten = segAt(t)[3];
  const H = 900;
  c.beginPath();
  for (let x = 0; x <= pen; x += 2) {
    const tau = t - (pen - x) / pps; let v = 0;
    for (const [b, a] of BEATS) { const d = tau - b; if (d > -0.05 && d < 0.65) v += wave(d) * a; }
    const y = y0 - v * H;
    x ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  const fade = 1 - prog(t, 17.3, 18.3);
  c.strokeStyle = `rgba(255,121,95,${0.75 * fade})`; c.lineWidth = 5; c.shadowColor = "rgba(255,121,95,.8)"; c.shadowBlur = 24 * fade; c.stroke();
  c.shadowBlur = 0;
  let v = 0; for (const [b, a] of BEATS) v += wave(t - b) * a;
  c.fillStyle = `rgba(255,190,170,${fade})`; c.beginPath(); c.arc(pen, y0 - v * H, 12, 0, 7); c.fill();
}
function grain(t) {
  const g = $("grain").getContext("2d"), im = g.createImageData(270, 480); let s = Math.floor(t * 30) * 9301 + 49297;
  for (let i = 0; i < im.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = s & 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
}
function show(id, on) { $(id).style.display = on ? "flex" : "none"; }
function setTime(t) {
  drawECG(t); grain(t);
  const seg = segAt(t);
  $("pct").textContent = Math.round(seg[3] * 100) + "%";
  ["l0", "l1", "l2", "l3", "l4", "end"].forEach(id => show(id, false));
  $("flash").style.opacity = 0; document.body.style.transform = "";
  const W = document.body;
  if (t < 3.0) {                                          // 90%: words flash, screen inverts
    show("l0", true);
    const k = Math.min(4, Math.floor(t / 0.5)), lt = t - k * 0.5;
    const w = $("w0");
    if (k < 4) { w.textContent = WORDS[k]; w.className = "big"; }
    else { w.textContent = "So plan it."; w.className = "big coral"; }
    const inv = k % 2 === 1;
    $("flash").style.opacity = inv ? 1 : 0;
    w.style.color = inv ? "#050506" : "";
    const pop = 1.25 - 0.25 * ease(prog(lt, 0, 0.12));
    w.style.transform = `scale(${pop}) rotate(${(k % 2 ? 1 : -1) * 1.5 * (1 - prog(lt, 0, .15))}deg)`;
    const sh = 14 * (1 - prog(lt, 0, 0.2));
    W.style.transform = `translate(${Math.sin(t * 90) * sh}px, ${Math.cos(t * 77) * sh}px)`;
  } else if (t < 6.5) {                                   // 50%: calm
    show("l1", true);
    $("a1").style.opacity = ease(prog(t, 3.1, 3.8)); $("a1").style.transform = `translateY(${30 * (1 - ease(prog(t, 3.1, 3.8)))}px)`;
    $("b1").style.opacity = ease(prog(t, 4.9, 5.6));
  } else if (t < 10.5) {                                  // 70%: the list slams in
    show("l2", true);
    [...$("l2").children].forEach((d, i) => {
      const a = 6.6 + i * 0.6, p = prog(t, a, a + 0.12);
      d.style.opacity = p ? 1 : 0; d.style.transform = `scale(${1.6 - 0.6 * ease(p)})`;
      d.style.color = i === LIST.length - 1 || t > a + 0.6 ? "#f4f1ec" : "#ff795f";
      if (t > a + 0.6) d.style.color = "#4a4744";
    });
    const last = Math.floor((t - 6.6) / 0.6), lt = (t - 6.6) - last * 0.6;
    const sh = t < 10.2 ? 8 * (1 - prog(lt, 0, 0.18)) : 0;
    W.style.transform = `translate(${Math.sin(t * 80) * sh}px, 0)`;
    if (t > 9.9) $("l2").style.opacity = 1 - prog(t, 10.1, 10.5); else $("l2").style.opacity = 1;
  } else if (t < 14) {                                    // 30%: breathe
    show("l3", true);
    const br = ease(prog(t, 10.6, 11.6));
    $("a3").style.opacity = br; $("a3").style.letterSpacing = `${0.12 - 0.12 * br}em`;
    $("b3").style.opacity = ease(prog(t, 12.0, 12.8));
  } else if (t < 17.5) {                                  // 20%: facts
    show("l4", true);
    const p1 = ease(prog(t, 14.1, 15.1));
    $("n1").textContent = Math.round(2598 * p1).toLocaleString("en-US");
    $("n2").textContent = Math.round(46 * ease(prog(t, 14.6, 15.6)));
    $("n1").style.opacity = $("c1").style.opacity = prog(t, 14.1, 14.4);
    $("n2").style.opacity = $("c2").style.opacity = prog(t, 14.6, 14.9);
    $("c3").style.opacity = ease(prog(t, 15.6, 16.3));
    $("l4").style.opacity = 1 - prog(t, 17.2, 17.5);
  } else {                                                // 10%: logo
    show("end", true);
    const e = $("end"), p = ease(prog(t, 17.6, 18.6));
    e.style.opacity = p; e.style.transform = `scale(${0.96 + 0.04 * p})`;
  }
  $("meter").style.opacity = t > 17.5 ? 1 - prog(t, 17.5, 18) : 1;
}
</script>
</body>
</html>
