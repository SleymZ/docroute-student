<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 500; src: url("../promo/fonts/noto-sans-devanagari-devanagari-500-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 700; src: url("../promo/fonts/noto-sans-devanagari-devanagari-700-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 800; src: url("../promo/fonts/noto-sans-devanagari-devanagari-800-normal.woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f1115; }
  body { font-family: "Inter", "Noto Sans Devanagari", sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
  .half { position: absolute; left: 0; right: 0; height: 960px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 70px; text-align: center; }
  #top { top: 0; background: #f3efe8; color: #1c1b1f; }
  #bot { top: 960px; background: #14161b; color: #f5f2ee; }
  .lab, .ic, .tx { position: relative; z-index: 2; }
  .lab { font-size: 44px; font-weight: 900; letter-spacing: .14em; padding: 14px 34px; border-radius: 999px; margin-bottom: 46px; }
  #top .lab { background: #dff3e6; color: #1f8a4c; }
  #bot .lab { background: #3a1618; color: #ff6b6b; }
  body.hi .lab { letter-spacing: .02em; }
  .ic { margin-bottom: 40px; }
  #top .tx { font-size: 92px; font-weight: 800; line-height: 1.08; letter-spacing: -0.03em; }
  #bot .tx { font-size: 72px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
  body.hi #top .tx, body.hi #bot .tx { letter-spacing: 0; line-height: 1.3; }
  #bot .tx div { display: block; }
  #bot .tx .red { color: #ff795f; }
  .tabs { position: absolute; inset: 0; pointer-events: none; }
  .tab { position: absolute; width: 250px; height: 70px; border-radius: 16px; background: #23262e; border: 2px solid #343842; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .tab i { width: 12px; height: 12px; border-radius: 50%; background: #4a4f5a; display: block; }
  .tab b { flex: 1; height: 12px; border-radius: 6px; background: #3a3f49; }
  #mid { position: absolute; left: 0; right: 0; top: 930px; height: 60px; display: flex; justify-content: center; z-index: 5; }
  #mid span { background: #ff795f; color: #1a0d09; font-size: 34px; font-weight: 900; border-radius: 999px; padding: 10px 30px; letter-spacing: .06em; }
  #hook, #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; z-index: 10; }
  #hook { background: #0f1115; color: #f5f2ee; }
  #hook .a { font-size: 110px; font-weight: 900; line-height: 1.04; letter-spacing: -0.035em; }
  #hook .b { margin-top: 34px; font-size: 64px; font-weight: 800; color: #ff795f; }
  body.hi #hook .a { letter-spacing: 0; line-height: 1.25; }
  #end { background: #0f1115; color: #f5f2ee; }
  #end .w { font-size: 112px; font-weight: 800; letter-spacing: -0.035em; margin-top: 30px; }
  #end .e1 { margin-top: 40px; font-size: 60px; font-weight: 800; line-height: 1.15; }
  #end .e2 { margin-top: 18px; font-size: 42px; font-weight: 600; color: #a9a5a1; line-height: 1.3; }
  #end .btn { margin-top: 70px; background: #ff795f; color: #1a0d09; font-size: 60px; font-weight: 800; border-radius: 999px; padding: 30px 64px; box-shadow: 0 20px 60px rgba(255,121,95,.35); }
  #end .u { margin-top: 40px; font-size: 42px; font-weight: 700; }
  #end .s { margin-top: 14px; font-size: 34px; font-weight: 600; color: #a9a5a1; }
</style>
</head>
<body>
<div id="top" class="half"><div class="lab"></div><div class="ic"></div><div class="tx"></div></div>
<div id="bot" class="half"><div class="tabs"></div><div class="lab"></div><div class="ic"></div><div class="tx"></div></div>
<div id="mid"><span>VS</span></div>
<div id="hook"><div class="a"></div><div class="b"></div></div>
<div id="end"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 2.0; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function logoSVG(size) { const L = window.LOGO; return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible"><path d="${L.ring}" fill="none" stroke="#f5f2ee" stroke-width="5.5" stroke-linecap="round"/><path fill="#ff795f" d="${L.europe}"/><path fill="#ff795f" d="${L.swoosh}"/><path fill="#f5f2ee" transform="${L.planeT}" d="${L.plane}"/></svg>`; }
// line icons: calm (expectation) and messy (reality)
const I = (d, c, s = 190) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS_E = [
  '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>',                                   // plane
  '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',                // calendar
  '<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',                              // bubble
  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',     // globe
  '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 17h6"/>', // passport
  '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/>',                             // one tab
];
const ICONS_R = [
  '<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M4 6v15h12"/>',                          // papers
  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',                                          // clock
  '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',                                                    // bars
  '<path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c-1 4-4 7-7 8M13 21l4-10 4 10M14.5 17h5"/>',            // translate
  '<path d="M6 3v12a4 4 0 0 0 4 4h8"/><path d="M15 16l3 3-3 3"/><path d="M6 9h6a4 4 0 0 1 4 4v1"/>',    // branching route
  '',                                                                                                  // tabs (drawn)
];
let S = {};
const P0 = 1.8, PL = 2.7;            // pairs start, pair length
function build() {
  const T = window.T; document.body.classList.add(window.LANG);
  S.top = document.getElementById("top"); S.bot = document.getElementById("bot");
  S.top.querySelector(".lab").textContent = T.exp; S.bot.querySelector(".lab").textContent = T.real;
  S.ttx = S.top.querySelector(".tx"); S.btx = S.bot.querySelector(".tx"); S.tic = S.top.querySelector(".ic"); S.bic = S.bot.querySelector(".ic");
  S.mid = document.getElementById("mid");
  S.hook = document.getElementById("hook"); S.hook.querySelector(".a").textContent = T.hook; S.hook.querySelector(".b").textContent = T.vs;
  S.tabs = S.bot.querySelector(".tabs");
  for (let i = 0; i < 27; i++) { const e = document.createElement("div"); e.className = "tab"; e.innerHTML = "<i></i><b></b>"; e.style.left = (40 + (i * 157) % 800) + "px"; e.style.top = (60 + ((i * 97) % 800)) + "px"; e.style.transform = `rotate(${(i % 5 - 2) * 4}deg)`; S.tabs.append(e); }
  S.tabEls = [...S.tabs.children];
  const end = document.getElementById("end"); S.end = end;
  end.innerHTML = `${logoSVG(220)}<div class="w"><span translate="no">Doc<span style="color:#ff795f">Route</span></span></div><div class="e1">${esc(T.end1)}</div><div class="e2">${esc(T.end2)}</div><div class="btn">${esc(T.cta)} ↑</div><div class="u">docroute-student.vercel.app</div><div class="s">${esc(T.small)}</div>`;
  S.endParts = [...end.children];
}
let cur = -1;
function setPair(k) {
  if (k === cur) return; cur = k; const T = window.T, [e, r] = T.pairs[k];
  S.ttx.textContent = e; S.tic.innerHTML = I(ICONS_E[k], "#1f8a4c");
  S.btx.innerHTML = r.map((x, i) => `<div class="${k === 0 && i > 0 ? "red" : k === 5 ? "red" : ""}">${esc(x)}</div>`).join("");
  S.bic.innerHTML = ICONS_R[k] ? I(ICONS_R[k], "#ff6b6b", 150) : "";
  S.btx.style.fontSize = k === 5 ? "160px" : k === 0 ? "64px" : "72px";
  S.tabs.style.display = k === 5 ? "block" : "none";
}
function setTime(t) {
  // hook
  S.hook.style.display = t < P0 ? "flex" : "none";
  if (t < P0) { const p = back(prog(t, 0, .35)); S.hook.querySelector(".a").style.transform = `scale(${.85 + .15 * p})`; S.hook.querySelector(".b").style.opacity = prog(t, .45, .7); }
  // pairs
  const k = Math.floor((t - P0) / PL), inPair = t >= P0 && k < 6;
  S.top.style.visibility = S.bot.style.visibility = S.mid.style.visibility = inPair ? "visible" : "hidden";
  if (inPair) {
    setPair(k); const lt = t - P0 - k * PL;
    // expectation: soft slide in, gentle float
    const ep = easeOut(prog(lt, 0, .3)); S.top.style.transform = `translateY(${(1 - ep) * -120}px)`; S.top.style.opacity = ep;
    S.ttx.style.transform = `translateY(${Math.sin(lt * 3) * 6}px)`;
    // reality: slams in on the beat at 0.9 s with a shake
    const rt = lt - .9, rp = prog(rt, 0, .18), amp = rt > 0 ? 26 * Math.exp(-rt * 8) : 0;
    S.bot.style.opacity = rt >= 0 ? 1 : 0; S.bot.style.transform = `translate(${Math.sin(t * 90) * amp}px, ${(1 - easeOut(rp)) * 200}px)`;
    S.mid.style.opacity = rt >= 0 ? 1 : .0; S.mid.style.transform = `scale(${1 + .4 * (1 - easeOut(prog(rt, 0, .2)))})`;
    // the list of "now" items pops one by one; the tabs pile up
    [...S.btx.children].forEach((d, i) => { const a = k === 0 ? .1 + i * .22 : .05 * i; d.style.opacity = prog(rt, a, a + .08); d.style.transform = `scale(${.7 + .3 * back(prog(rt, a, a + .2))})`; });
    if (k === 5) S.tabEls.forEach((e, i) => { const a = .05 + i * .035; e.style.opacity = prog(rt, a, a + .05) * .9; });
    S.bic.style.transform = `rotate(${rt > 0 ? Math.sin(rt * 20) * 6 * Math.exp(-rt * 3) : 0}deg)`;
  }
  // end card
  const e0 = P0 + 6 * PL; S.end.style.display = t >= e0 ? "flex" : "none";
  if (t >= e0) S.endParts.forEach((e, i) => { const p = easeOut(prog(t, e0 + i * .14, e0 + .4 + i * .14)); e.style.opacity = p; e.style.transform = `translateY(${(1 - p) * 40}px)` + (i === 4 ? ` scale(${1 + .04 * Math.max(0, Math.sin((t - e0 - 1.3) * 4.5))})` : ""); });
}
window.build = build; window.setTime = setTime;
</script>
</body>
</html>
