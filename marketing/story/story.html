<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 500; src: url("../promo/fonts/noto-sans-devanagari-devanagari-500-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 700; src: url("../promo/fonts/noto-sans-devanagari-devanagari-700-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 800; src: url("../promo/fonts/noto-sans-devanagari-devanagari-800-normal.woff2"); }
  :root { --bg: #0f1115; --ink: #f5f2ee; --muted: #a9a5a1; --coral: #ff795f; --card: #191c22; --line: #2b2f37; --ok: #5ad48a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Noto Sans Devanagari", "Noto Sans CJK SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  #map { position: absolute; left: 0; top: 150px; width: 1080px; height: 1100px; transform-origin: 540px 560px; }
  .mini { position: absolute; width: 230px; height: 150px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: 0 14px 30px rgba(0,0,0,.5); }
  .mini .bar { display: flex; gap: 6px; margin-bottom: 14px; } .mini .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3f49; display: block; }
  .mini .ln { height: 10px; border-radius: 5px; background: #2f343d; margin-bottom: 10px; }
  .big { position: absolute; left: 110px; right: 110px; top: 330px; background: var(--card); border: 2px solid var(--line); border-radius: 36px; padding: 40px 44px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .big .term { font-size: 44px; font-weight: 700; color: #d9d5d0; padding: 14px 0; border-bottom: 2px solid var(--line); font-family: "Inter", sans-serif; }
  .big .term:last-child { border-bottom: 0; }
  .pill { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: center; }
  .pill span { display: inline-flex; gap: 20px; align-items: center; background: #23262e; border: 2px solid #3a3f49; border-radius: 999px; padding: 22px 40px; font-size: 44px; font-weight: 700; }
  .q { color: var(--coral); font-family: "Inter", monospace; min-width: 160px; }
  .word { font-weight: 800; font-size: 120px; letter-spacing: -0.035em; text-align: center; }
  .chips { position: absolute; left: 70px; right: 70px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .chip { font-size: 42px; font-weight: 700; padding: 20px 34px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); }
  .chip.on { background: var(--coral); color: #1a0d09; border-color: var(--coral); }
  .card { position: absolute; left: 80px; right: 80px; background: var(--card); border: 2px solid var(--line); border-radius: 40px; padding: 40px 44px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .cardhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cardhead .t { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 800; }
  .tag { font-size: 28px; font-weight: 700; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: 8px 22px; }
  .step { display: flex; gap: 26px; align-items: center; padding: 22px 0; border-top: 2px solid var(--line); }
  .num { flex: 0 0 66px; height: 66px; border-radius: 50%; border: 4px solid #3a3f49; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: var(--muted); }
  .stxt b { display: block; font-size: 40px; font-weight: 700; line-height: 1.2; }
  .src { display: inline-block; margin-top: 10px; font-size: 27px; font-weight: 600; color: var(--ok); background: rgba(90,212,138,.12); border-radius: 999px; padding: 5px 16px; }
  .lang { font-size: 64px; font-weight: 800; padding: 26px 50px; border-radius: 28px; background: var(--card); border: 2px solid var(--line); }
  .btn { display: inline-block; background: var(--coral); color: #1a0d09; font-weight: 800; font-size: 60px; border-radius: 999px; padding: 34px 70px; box-shadow: 0 20px 60px rgba(255,121,95,.35); }
  .center { position: absolute; left: 80px; right: 80px; text-align: center; }
  #cap { position: absolute; left: 70px; right: 70px; top: 1300px; text-align: center; font-size: 52px; font-weight: 700; line-height: 1.3; text-shadow: 0 3px 18px rgba(0,0,0,.9); }
  body.hi #cap { line-height: 1.45; }
  #cap .w { opacity: .35; } #cap .w.on { opacity: 1; }
</style>
</head>
<body>
<div id="root" class="layer"></div>
<div id="cap"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function io(t, a, b, inD = .45, outD = .35) { const i = easeOut(prog(t, a, a + inD)), o = easeInOut(prog(t, b - outD, b)); return { op: i * (1 - o), dy: (1 - i) * 50 - o * 40 }; }
function setIO(e, s, extra = "") { e.style.opacity = s.op; e.style.transform = `translateY(${s.dy}px) ${extra}`; e.style.visibility = s.op <= .001 ? "hidden" : "visible"; }
function logoSVG(size) {
  const L = window.LOGO;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible"><path d="${L.ring}" fill="none" stroke="#f5f2ee" stroke-width="5.5" stroke-linecap="round"/><path fill="#ff795f" d="${L.europe}"/><path fill="#ff795f" d="${L.swoosh}"/><path fill="#f5f2ee" transform="${L.planeT}" d="${L.plane}"/></svg>`;
}
const wordmark = () => `<span translate="no">Doc<span style="color:var(--coral)">Route</span></span>`;
const PLANE = "M12 0L4.5 -1.6L-1 -8.6L-4.2 -8.6L-1.4 -1.8L-7 -1.4L-9.2 -4.8L-11.3 -4.8L-10.2 0L-11.3 4.8L-9.2 4.8L-7 1.4L-1.4 1.8L-4.2 8.6L-1 8.6L4.5 1.6Z";
function arcD(a, b, bend) { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1]; return `M${a[0]} ${a[1]}Q${mx - dy * bend} ${my + dx * bend} ${b[0]} ${b[1]}`; }

let S = {}, TL;
function build() {
  const T = window.T, M = window.MAP, P = window.P, root = document.getElementById("root");
  TL = window.TL; document.body.classList.add(window.LANG);
  // map with the arcs
  const starts = [[-120, 380], [-80, 1200], [380, 1260], [900, 1260], [1200, 900], [1200, 300], [-120, 820], [1180, 1150], [620, 1280]];
  const many = M.ends.many.map((e, i) => `<path class="arc" d="${arcD(starts[i], e, i % 2 ? .22 : -.22)}" fill="none" stroke="#ff795f" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 14" opacity=".9"/><circle class="dot" cx="${e[0]}" cy="${e[1]}" r="11" fill="#ff795f"/>`).join("");
  root.insertAdjacentHTML("beforeend", `<svg id="map" viewBox="0 0 ${M.W} ${M.H}">
    <path d="${M.other}" fill="#15181d" stroke="#20242b" stroke-width="1.2"/>
    <path d="${M.eu}" fill="#2a2f3a" stroke="#3d4350" stroke-width="1.4"/>
    <path id="mainArc" d="${arcD([-60, 1150], M.ends.main, -.25)}" fill="none" stroke="#ff795f" stroke-width="6" stroke-linecap="round"/>
    <g id="mainPlane"><path d="${PLANE}" fill="#f5f2ee" transform="scale(2.6)"/></g>
    <circle id="mainDot" cx="${M.ends.main[0]}" cy="${M.ends.main[1]}" r="14" fill="#ff795f"/>
    <g id="many">${many}</g></svg>`);
  S.map = document.getElementById("map"); S.mainArc = document.getElementById("mainArc"); S.mainPlane = document.getElementById("mainPlane"); S.mainDot = document.getElementById("mainDot");
  S.arcs = [...S.map.querySelectorAll("#many .arc")]; S.dots = [...S.map.querySelectorAll("#many .dot")];
  S.mainLen = S.mainArc.getTotalLength(); S.arcLens = S.arcs.map(a => a.getTotalLength());
  // scattered sites
  const pos = [[60, 260], [330, 200], [640, 250], [820, 420], [90, 520], [420, 470], [700, 640], [180, 800], [520, 860], [800, 930], [40, 1060], [380, 1090]];
  S.minis = pos.map(([x, y], i) => { const m = el("div", "mini", `<div class="bar"><i></i><i></i><i></i></div>` + [80, 60, 90, 45].map(w => `<div class="ln" style="width:${w - (i * 7) % 20}%"></div>`).join("")); m.style.left = x + "px"; m.style.top = y + "px"; root.append(m); return m; });
  // foreign words card + translator
  const terms = ["Povolenie na prechodný pobyt", "Aufenthaltstitel", "Povolení k dlouhodobému pobytu", "Verblijfsvergunning", "Zezwolenie na pobyt czasowy", "Permesso di soggiorno"];
  S.big = el("div", "big", terms.map(x => `<div class="term">${x}</div>`).join("")); root.append(S.big);
  S.pill = el("div", "pill", `<span><svg width="54" height="54" viewBox="0 0 24 24"><path fill="#f5f2ee" d="M12.9 15.1 10.4 12.6l.1-.1A17 17 0 0 0 14.1 6H17V4h-7V2H8v2H1v2h11.2A15.8 15.8 0 0 1 9 11.4 15.6 15.6 0 0 1 6.7 8H4.7a17.6 17.6 0 0 0 2.9 4.5l-5.1 5L4 19l5-5 3.1 3.1.8-2zM18.5 10h-2L12 22h2l1.1-3h4.8l1.1 3h2l-4.5-12zm-2.6 7 1.6-4.3 1.6 4.3h-3.2z"/></svg>${esc(T.translator)} <b class="q">???</b></span>`);
  root.append(S.pill); S.q = S.pill.querySelector(".q");
  S.pill.style.top = (330 + S.big.offsetHeight + 50) + "px";
  // the decision: one straight line
  S.line = el("div", "abs"); S.line.style.cssText = "left:140px;top:760px;height:8px;border-radius:4px;background:var(--coral);width:800px;transform-origin:left center"; root.append(S.line);
  // DocRoute logo
  S.logo = el("div", "layer", `<div style="position:absolute;left:0;right:0;top:230px;display:flex;justify-content:center;align-items:center;gap:30px">${logoSVG(150)}<span class="word" style="font-size:104px">${wordmark()}</span></div>`);
  root.append(S.logo);
  // goals + route
  S.goals = el("div", "chips", T.goals.map(g => `<span class="chip">${esc(g)}</span>`).join("")); S.goals.style.top = "250px"; root.append(S.goals);
  S.goalChips = [...S.goals.children];
  S.card = el("div", "card", `<div class="cardhead"><div class="t">${logoSVG(54)}${wordmark()}</div><div class="tag">${esc(T.example)}</div></div>` +
    T.steps.map((s, i) => `<div class="step"><div class="num">${i + 1}</div><div class="stxt"><b>${esc(s)}</b><span class="src">✓ ${esc(T.source)}</span></div></div>`).join(""));
  root.append(S.card); S.card.style.top = (250 + S.goals.offsetHeight + 50) + "px";
  S.steps = [...S.card.querySelectorAll(".step")];
  // languages
  S.langs = el("div", "chips", ["English", "Русский", "Español", "中文", "हिन्दी"].map(l => `<span class="lang">${l}</span>`).join("")); S.langs.style.top = "380px"; S.langs.style.gap = "30px"; root.append(S.langs);
  S.langChips = [...S.langs.children];
  // end card
  S.end = el("div", "layer", `<div style="position:absolute;left:0;right:0;top:260px;display:flex;justify-content:center">${logoSVG(250)}</div>
    <div class="center word" style="top:550px;font-size:110px">${wordmark()}</div>
    <div class="center" style="top:720px;font-size:46px;font-weight:600">${esc(P.tagline)}</div>
    <div class="center" style="top:860px"><span class="btn">${esc(T.cta)}</span></div>
    <div class="center" style="top:1060px;font-size:44px;font-weight:700">docroute-student.vercel.app</div>
    <div class="center" style="top:1140px;font-size:32px;font-weight:500;color:var(--muted)">${esc(P.disclaimer)}</div>`);
  root.append(S.end); S.endParts = [...S.end.children];
  // captions: words (or characters for Chinese) light up as the line is read
  S.capLines = T.lines.map(line => {
    const parts = window.LANG === "zh" ? [...line] : line.split(/(\s+)/);
    return parts.map(p => /^\s+$/.test(p) ? p : `<span class="w">${esc(p)}</span>`).join("");
  });
}
let capIdx = -2;
function caption(t) {
  const cap = document.getElementById("cap");
  let k = -1; TL.forEach((l, i) => { if (t >= l.a - .15 && t < (TL[i + 1] ? TL[i + 1].a - .15 : l.b + 1.2)) k = i; });
  if (k !== capIdx) { capIdx = k; cap.innerHTML = k >= 0 ? S.capLines[k] : ""; cap.style.fontSize = "52px"; let fs = 52; while (cap.offsetHeight > 330 && fs > 34) { fs -= 2; cap.style.fontSize = fs + "px"; } S.ws = [...cap.querySelectorAll(".w")]; S.wl = S.ws.map(w => w.textContent.length); }
  if (k < 0) return;
  const l = TL[k], p = prog(t, l.a, l.b), total = S.wl.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; S.ws.forEach((w, i) => { w.classList.toggle("on", acc / total <= p + .02); acc += S.wl[i]; });
  cap.style.opacity = easeOut(prog(t, l.a - .15, l.a + .1)) * (k === 7 ? 1 : 1);
}

function setTime(t) {
  const A = i => TL[i].a, E = i => (TL[i + 1] ? TL[i + 1].a : 1e9);
  // map: visible in lines 0-1 and 4, dim otherwise
  const mapOn = Math.max(io(t, 0, E(1), .6, .5).op, io(t, A(4) + 1.2, E(4), .7, .5).op * 1);
  S.map.style.opacity = .25 + .75 * mapOn; S.map.style.visibility = t < E(4) ? "visible" : "hidden";
  S.map.style.opacity = t < E(4) ? (t < E(1) ? 1 : t < A(4) ? clamp(1 - prog(t, E(1) - .3, E(1) + .3) * .8, .2) : .2 + .8 * easeOut(prog(t, A(4) + 1.2, A(4) + 2))) : 0;
  const zoom = 1 + .06 * prog(t, 0, E(1));
  S.map.style.transform = `scale(${zoom})`;
  // main arc during line 0
  const ap = easeInOut(prog(t, A(0) + .2, A(0) + 4.2)), mainOp = 1 - prog(t, A(4) - .4, A(4));
  S.mainArc.style.strokeDasharray = S.mainLen; S.mainArc.style.strokeDashoffset = S.mainLen * (1 - ap); S.mainArc.style.opacity = mainOp * (t < A(4) ? 1 : 0);
  const p0 = S.mainArc.getPointAtLength(S.mainLen * ap), p1 = S.mainArc.getPointAtLength(Math.min(S.mainLen, S.mainLen * ap + 2));
  const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180 / Math.PI;
  S.mainPlane.setAttribute("transform", `translate(${p0.x} ${p0.y}) rotate(${ang})`); S.mainPlane.style.opacity = ap > 0 && ap < 1 ? 1 : 0;
  const dp = prog(t, A(0) + 4.1, A(0) + 4.5); S.mainDot.style.opacity = dp * mainOp * (t < A(4) ? 1 : 0); S.mainDot.setAttribute("r", 14 + 8 * Math.sin(t * 4) * dp);
  // many arcs during line 4
  S.arcs.forEach((a, i) => { const s = A(4) + 1.4 + i * .22, p = easeInOut(prog(t, s, s + 1.6)); a.style.strokeDasharray = `${S.arcLens[i]}`; a.style.strokeDashoffset = S.arcLens[i] * (1 - p); a.style.opacity = t < E(4) ? .9 : 0; S.dots[i].style.opacity = prog(t, s + 1.5, s + 1.7); });
  // scattered sites during line 1 (they stay under the big card in line 2)
  S.minis.forEach((m, i) => { const s = A(1) + .1 + i * .16, p = back(prog(t, s, s + .35)); const o = prog(t, s, s + .1) * (1 - prog(t, E(2) - .4, E(2))); m.style.opacity = o * (t > A(2) ? .45 : 1); m.style.visibility = o > 0 ? "visible" : "hidden"; m.style.transform = `scale(${p}) rotate(${(i % 3 - 1) * 4}deg)`; });
  // foreign words + translator during line 2
  setIO(S.big, io(t, A(2), E(2), .5));
  const tp = io(t, A(2) + 2.2, E(2), .4); setIO(S.pill, tp);
  const glyphs = "?#%&@*", phase = Math.floor(t * 8);
  S.q.textContent = t < A(2) + 3.2 ? [0, 1, 2].map(j => glyphs[(phase + j * 2) % glyphs.length]).join("") : "???";
  S.pill.style.transform += ` translateX(${t > A(2) + 3 && t < A(2) + 3.6 ? Math.sin(t * 60) * 8 : 0}px)`;
  // the decision during line 3
  const lp = easeInOut(prog(t, A(3) + .1, A(3) + 1.4)), lo = 1 - prog(t, E(3) - .3, E(3));
  S.line.style.opacity = t > A(3) && t < E(3) ? lo : 0; S.line.style.transform = `scaleX(${lp})`;
  // logo during line 4
  const lg = io(t, A(4) + .1, E(4), .5); setIO(S.logo, lg, `scale(${.85 + .15 * back(prog(t, A(4) + .1, A(4) + .6))})`);
  // goals + route card during line 5
  setIO(S.goals, io(t, A(5), E(5), .45));
  const gi = Math.floor(prog(t, A(5) + .5, A(5) + 3.3) * 4 - 1e-6);
  S.goalChips.forEach((c, i) => c.classList.toggle("on", t < A(5) + 3.3 ? i === gi : i === 0));
  setIO(S.card, io(t, A(5) + 2.2, E(5), .5));
  const span = TL[5].b - (A(5) + 3.2);
  S.steps.forEach((s, i) => { const d = prog(t, A(5) + 3.2 + span * (i / 4), A(5) + 3.5 + span * (i / 4)), n = s.querySelector(".num");
    n.style.borderColor = d > 0 ? "var(--ok)" : "#3a3f49"; n.style.background = `rgba(90,212,138,${.9 * d})`; n.style.color = d > .5 ? "#0f1115" : "var(--muted)"; n.textContent = d > .5 ? "✓" : String(i + 1); });
  // languages during line 6
  setIO(S.langs, io(t, A(6), E(6), .3));
  S.langChips.forEach((c, i) => { const p = back(prog(t, A(6) + .1 + i * .22, A(6) + .45 + i * .22)); c.style.transform = `scale(${p})`; c.style.borderColor = p > .9 ? "var(--coral)" : "var(--line)"; });
  // end card from line 7
  S.end.style.visibility = t >= A(7) - .1 ? "visible" : "hidden";
  S.endParts.forEach((e, i) => { const s = io(t, A(7) - .1 + i * .15, 1e9, .45); setIO(e, s, i === 0 ? `scale(${.6 + .4 * back(prog(t, A(7) - .1, A(7) + .4))})` : ""); });
  caption(t);
}
window.build = build; window.setTime = setTime;
</script>
</body>
</html>
