<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 500; src: url("../promo/fonts/noto-sans-devanagari-devanagari-500-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 700; src: url("../promo/fonts/noto-sans-devanagari-devanagari-700-normal.woff2"); }
  @font-face { font-family: "Noto Sans Devanagari"; font-weight: 800; src: url("../promo/fonts/noto-sans-devanagari-devanagari-800-normal.woff2"); }
  :root { --bg: #0f1115; --ink: #f5f2ee; --muted: #a9a5a1; --coral: #ff795f; --card: #191c22; --line: #2b2f37; --ok: #5ad48a; --red: #ff6b6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Noto Sans Devanagari", "Noto Sans CJK SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }
  body.zh { font-family: "Inter", "Noto Sans CJK SC", sans-serif; }
  #glow { position: absolute; inset: -200px; }
  .layer { position: absolute; inset: 0; }
  .center { position: absolute; left: 80px; right: 80px; text-align: center; }
  .h2 { font-weight: 800; font-size: 78px; line-height: 1.12; letter-spacing: -0.025em; }
  .lead { font-weight: 600; font-size: 46px; line-height: 1.3; color: var(--muted); }
  body.hi .h2 { letter-spacing: 0; line-height: 1.3; }
  .coral { color: var(--coral); }
  /* the opening */
  #hit { position: absolute; inset: 0; }
  #hit .lab { position: absolute; left: 60px; right: 60px; top: 300px; text-align: center; font-size: 58px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  #hit .num { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-size: 900px; font-weight: 900; line-height: 1; letter-spacing: -0.06em; font-family: "Inter", sans-serif; font-variant-numeric: tabular-nums; }
  #hit .sub { position: absolute; left: 50px; right: 50px; top: 1330px; text-align: center; font-size: 104px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.1; }
  body.hi #hit .sub, body.hi #hit .lab { letter-spacing: 0; }
  .word { font-weight: 800; font-size: 112px; letter-spacing: -0.035em; }
  .card { position: absolute; left: 70px; right: 70px; background: var(--card); border: 2px solid var(--line); border-radius: 40px; padding: 36px 40px 18px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .cardhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cardhead .t { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 800; }
  .tag { font-size: 28px; font-weight: 700; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: 8px 22px; }
  .urow { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 26px 0; border-top: 2px solid var(--line); }
  .urow b { display: block; font-size: 42px; font-weight: 800; }
  .urow .ad { display: block; font-size: 32px; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .left { font-size: 38px; font-weight: 800; color: var(--coral); background: rgba(255,121,95,.15); border-radius: 999px; padding: 12px 26px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .step { display: flex; gap: 26px; align-items: center; padding: 20px 0; border-top: 2px solid var(--line); }
  .num2 { flex: 0 0 66px; height: 66px; border-radius: 50%; border: 4px solid #3a3f49; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: var(--muted); }
  .step b { display: block; font-size: 39px; font-weight: 700; line-height: 1.22; }
  .meta { display: flex; gap: 16px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .date { font-size: 30px; font-weight: 700; color: var(--coral); }
  .src { font-size: 26px; font-weight: 600; color: var(--ok); background: rgba(90,212,138,.12); border-radius: 999px; padding: 5px 16px; }
  .btn { display: inline-block; background: var(--coral); color: #1a0d09; font-weight: 800; font-size: 60px; border-radius: 999px; padding: 32px 66px; box-shadow: 0 20px 60px rgba(255,121,95,.35); }
  .url { font-size: 44px; font-weight: 700; }
  .small { font-size: 32px; font-weight: 500; color: var(--muted); }
</style>
</head>
<body>
<canvas id="glow" width="1480" height="2320"></canvas>
<div id="root" class="layer"></div>
<div id="hit"><div class="lab"></div><div class="num"></div><div class="sub"></div></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function io(t, a, b, inDur = .45, outDur = .3) { const i = easeOut(prog(t, a, a + inDur)), o = easeInOut(prog(t, b - outDur, b)); return { op: i * (1 - o), dy: (1 - i) * 50 - o * 50 }; }
function setIO(e, s, extra = "") { e.style.opacity = s.op; e.style.transform = `translateY(${s.dy}px) ${extra}`; e.style.visibility = s.op <= .001 ? "hidden" : "visible"; }
function fit(e, maxLines) { let fs = parseFloat(getComputedStyle(e).fontSize); const lh = () => parseFloat(getComputedStyle(e).lineHeight); while (e.offsetHeight > lh() * maxLines + 2 && fs > 40) { fs -= 4; e.style.fontSize = fs + "px"; } }
function logoSVG(size) { const L = window.LOGO; return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible"><path d="${L.ring}" fill="none" stroke="#f5f2ee" stroke-width="5.5" stroke-linecap="round"/><path fill="#ff795f" d="${L.europe}"/><path fill="#ff795f" d="${L.swoosh}"/><path fill="#f5f2ee" transform="${L.planeT}" d="${L.plane}"/></svg>`; }
const wordmark = () => `<span translate="no">Doc<span class="coral">Route</span></span>`;
function ruDays(n) { const a = n % 10, b = n % 100; return n + " " + (a === 1 && b !== 11 ? "день" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "дня" : "дней"); }
// the opening: four hits
const HITS = [-0.12, 0.9, 1.6, 2.3];
const LOOK = [
  { bg: "#ff795f", num: "#1a0d09", lab: "rgba(26,13,9,.75)" },
  { bg: "#0f1115", num: "#ff795f", lab: "rgba(245,242,238,.7)" },
  { bg: "#ff795f", num: "#1a0d09", lab: "rgba(26,13,9,.75)" },
  { bg: "#2a0d10", num: "#ff6b6b", lab: "rgba(255,180,180,.8)" },
];
let S = {};
function build() {
  const T = window.T, root = document.getElementById("root"); document.body.classList.add(window.LANG);
  S.hit = document.getElementById("hit"); S.hl = S.hit.querySelector(".lab"); S.hn = S.hit.querySelector(".num"); S.hs = S.hit.querySelector(".sub");
  S.hl.textContent = T.deadlineLabel;
  // the descent
  S.zero = el("div", "center", "0"); S.zero.style.cssText += "top:420px;font-size:420px;font-weight:900;line-height:1;color:#2c3038;font-family:Inter,sans-serif"; root.append(S.zero);
  S.lose = el("div", "center h2", esc(T.lose)); S.lose.style.top = "980px"; S.lose.style.color = "#d9d5d0"; root.append(S.lose); fit(S.lose, 3);
  // DocRoute
  S.logo = el("div", "layer", `<div style="position:absolute;left:0;right:0;top:520px;display:flex;justify-content:center">${logoSVG(320)}</div>
    <div class="center word" style="top:890px">${wordmark()}</div>
    <div class="center h2 sh" style="top:1060px;font-size:62px">${esc(T.shows)}</div>`); root.append(S.logo);
  S.logoParts = [...S.logo.children]; fit(S.logo.querySelector(".sh"), 3);
  // Top 100
  S.tt = el("div", "center h2", esc(T.topTitle)); S.tt.style.top = "230px"; root.append(S.tt); fit(S.tt, 3);
  const L = window.LANG, left = n => L === "ru" ? "осталось " + ruDays(n) : T.left.replace("{0}", n);
  S.top = el("div", "card", `<div class="cardhead"><div class="t">${logoSVG(54)}${wordmark()}</div><div class="tag">${esc(T.example)}</div></div>` +
    ["A", "B", "C"].map((x, i) => `<div class="urow"><div><b>${esc(T.uni)} ${x}</b><span class="ad">${esc(T.applyBy)} ${esc(T.udates[i])}</span></div><span class="left" data-n="${T.udays[i]}">${esc(left(T.udays[i]))}</span></div>`).join(""));
  root.append(S.top); S.top.style.top = (S.tt.offsetTop + S.tt.offsetHeight + 60) + "px";
  S.urows = [...S.top.querySelectorAll(".urow")]; S.lefts = [...S.top.querySelectorAll(".left")]; S.leftFmt = left;
  S.lefts.forEach(e => { e.style.minWidth = e.offsetWidth + "px"; e.style.textAlign = "center"; });
  // after admission
  S.at = el("div", "center h2", esc(T.afterTitle)); S.at.style.top = "230px"; root.append(S.at); fit(S.at, 3);
  S.rc = el("div", "card", `<div class="cardhead"><div class="t">${logoSVG(54)}${wordmark()}</div><div class="tag">${esc(T.example)}</div></div>` +
    T.steps.map((s, i) => `<div class="step"><div class="num2">${i + 1}</div><div><b>${esc(s)}</b><div class="meta"><span class="date">${esc(T.dates[i])}</span><span class="src">✓ ${esc(T.source)}</span></div></div></div>`).join(""));
  root.append(S.rc); S.rc.style.top = (S.at.offsetTop + S.at.offsetHeight + 60) + "px"; S.steps = [...S.rc.querySelectorAll(".step")];
  // call to action
  S.end = el("div", "layer", `<div style="position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center">${logoSVG(240)}</div>
    <div class="center word" style="top:580px;font-size:104px">${wordmark()}</div>
    <div class="center h2 ck" style="top:750px;font-size:68px">${esc(T.check)}</div>
    <div class="center" style="top:960px"><span class="btn">${esc(T.cta)}</span></div>
    <div class="center lead" style="top:1150px">${esc(T.sub)}</div>
    <div class="center url" style="top:1250px">docroute-student.vercel.app</div>
    <div class="center small" style="top:1340px">${esc(T.disclaimer)}</div>`); root.append(S.end);
  S.endParts = [...S.end.children]; fit(S.end.querySelector(".ck"), 2);
}
function glow(t, amt) {
  const c = document.getElementById("glow"), g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height); if (amt <= 0) return;
  const x = 740 + Math.sin(t * .5) * 260, y = 700 + Math.cos(t * .37) * 300;
  let r = g.createRadialGradient(x, y, 0, x, y, 900); r.addColorStop(0, `rgba(255,121,95,${.18 * amt})`); r.addColorStop(1, "rgba(255,121,95,0)"); g.fillStyle = r; g.fillRect(0, 0, c.width, c.height);
  r = g.createRadialGradient(500, 1800, 0, 500, 1800, 800); r.addColorStop(0, `rgba(90,120,255,${.1 * amt})`); r.addColorStop(1, "rgba(90,120,255,0)"); g.fillStyle = r; g.fillRect(0, 0, c.width, c.height);
}
function setTime(t) {
  const T = window.T;
  // 0–3.1 the opening: a number slams in on every hit
  let k = 0; HITS.forEach((h, i) => { if (t >= h) k = i; });
  const h = HITS[k], lk = LOOK[k], open = t < 3.1;
  S.hit.style.display = open ? "block" : "none";
  if (open) {
    const slam = 1 + .4 * (1 - easeOut(prog(t, h, h + .2))), amp = (k === 3 ? 34 : 20) * Math.exp(-(t - h) * 9);
    const sx = Math.sin(t * 95) * amp, sy = Math.cos(t * 83) * amp * .6;
    S.hit.style.background = lk.bg; S.hit.style.transform = `translate(${sx}px, ${sy}px)`;
    S.hn.textContent = String(3 - k); S.hn.style.color = lk.num; S.hn.style.transform = `scale(${slam * (k === 3 ? 1 + .05 * prog(t, 2.5, 3.1) : 1)})`;
    S.hl.style.color = lk.lab; S.hs.style.color = lk.num;
    S.hs.textContent = k === 3 ? T.missed : k === 2 ? T.dayOne : T.daysMany;
    S.hs.style.transform = `scale(${1 + .15 * (1 - easeOut(prog(t, h + .05, h + .25)))})`;
  }
  glow(t, prog(t, 4.5, 7));
  // 3.1–6.5 the descent: quiet, slow, grey
  const d = prog(t, 3.1, 6.5);
  S.zero.style.visibility = t >= 3.1 && t < 6.5 ? "visible" : "hidden";
  S.zero.style.opacity = (1 - easeInOut(prog(t, 5.6, 6.4))) * (.25 + .75 * easeOut(prog(t, 3.1, 3.4)));
  S.zero.style.transform = `translateY(${-60 * d}px) scale(${1 - .12 * d})`;
  setIO(S.lose, io(t, 3.6, 6.5, 1.0, .35));
  // 6.5–9.1 DocRoute
  S.logoParts.forEach((e, i) => setIO(e, io(t, 6.55 + i * .25, 9.1, .5), i === 0 ? `scale(${.7 + .3 * back(prog(t, 6.55, 7.1))})` : ""));
  // 9.1–14.4 Top 100 with days left
  setIO(S.tt, io(t, 9.15, 14.4, .4)); setIO(S.top, io(t, 9.4, 14.4, .45));
  S.urows.forEach((r, i) => { const a = 9.9 + i * .5, p = easeOut(prog(t, a, a + .4)); r.style.opacity = p; r.style.transform = `translateX(${(1 - p) * 60}px)`;
    const e = S.lefts[i], n = +e.dataset.n, c = Math.round(n * easeOut(prog(t, a + .1, a + 1.3))); e.textContent = S.leftFmt(c); });
  // 14.4–18 after admission
  setIO(S.at, io(t, 14.45, 18, .4)); setIO(S.rc, io(t, 14.65, 18, .45));
  S.steps.forEach((s, i) => { const dd = prog(t, 15.3 + i * .55, 15.6 + i * .55), n = s.querySelector(".num2");
    n.style.borderColor = dd > 0 ? "var(--ok)" : "#3a3f49"; n.style.background = `rgba(90,212,138,${.9 * dd})`; n.style.color = dd > .5 ? "#0f1115" : "var(--muted)"; n.textContent = dd > .5 ? "✓" : String(i + 1); });
  // 18–22 call to action
  S.end.style.visibility = t >= 18 ? "visible" : "hidden";
  S.endParts.forEach((e, i) => { const s = io(t, 18.05 + i * .16, 99, .4); let extra = ""; if (i === 0) extra = `scale(${.6 + .4 * back(prog(t, 18.05, 18.6))})`; if (i === 3) extra = `scale(${1 + .04 * Math.max(0, Math.sin((t - 19.3) * 4.2))})`; setIO(e, s, extra); });
}
window.build = build; window.setTime = setTime;
</script>
</body>
</html>
